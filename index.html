<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전개도 레이더</title>
<link rel="stylesheet" href="common.css">
<style>
  body { font-size:18px; }
  .wrap { max-width:720px; margin:0 auto; padding:12px; }
  h1 { font-size:22px; margin:8px 0; }
  .who { font-size:14px; color:var(--gray); display:flex; justify-content:space-between; }
  .opt { display:block; width:100%; text-align:left; margin:8px 0; padding:14px; font-size:18px; border-width:2px; }
  .opt.sel { border-color:var(--blue); background:#eaf0ff; }
  .opt.prev { border-style:dashed; }
  .opt.correct { border-color:var(--green); background:#e7f7ee; }
  .opt .tag { float:right; font-size:13px; color:var(--gray); }
  .conf button { flex:1; font-size:17px; }
  .conf button.sel { background:var(--blue); color:#fff; border-color:var(--blue); }
  .why { width:100%; margin-top:8px; }
  .big { font-size:28px; text-align:center; margin:24px 0; }
  .status { margin-top:8px; color:var(--green); min-height:1.4em; }
  table.res { width:100%; border-collapse:collapse; }
  table.res td, table.res th { border-bottom:1px solid var(--line); padding:8px; text-align:center; }
  label.f { display:block; margin:10px 0 4px; font-weight:600; }
  .full { width:100%; }
</style>
</head>
<body>
<div class="wrap">
  <h1>전개도 레이더</h1>

  <!-- 입장 -->
  <div id="vJoin" class="card">
    <label class="f">방 코드 (숫자 4자리)</label>
    <div class="row"><input id="code" class="full" inputmode="numeric" maxlength="4" autocomplete="off" style="flex:1"><button id="btnCode" class="primary">확인</button></div>
    <div id="joinMore" class="hide">
      <label class="f">반</label><select id="ban" class="full"></select>
      <label class="f">번호</label><select id="num" class="full"></select>
      <label class="f">모둠</label><select id="grp" class="full"></select>
      <p class="muted" style="font-size:14px">이름은 받지 않아요. 반·번호·모둠만 골라요.</p>
      <button id="btnJoin" class="primary full">들어가기</button>
    </div>
    <div id="joinErr" class="err"></div>
  </div>

  <!-- 수업 중 -->
  <div id="vLive" class="hide">
    <div class="who"><span id="whoTxt"></span><span>남은 시간 <span id="timer" class="timer"></span></span></div>
    <div id="screen"></div>
    <div id="liveErr" class="err"></div>
  </div>
</div>
<script src="common.js"></script>
<script>
  var me = null;          // {code, ban, num, group}
  var sid = localStorage.getItem('jr_sid');
  if (!sid) { sid = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/[^A-Za-z0-9-]/g, ''); localStorage.setItem('jr_sid', sid); }
  var last = null, renderedKey = '', pick = { a: null, c: null };

  function opts(sel, from, to, ph) {
    var h = '<option value="">' + ph + '</option>';
    for (var i = from; i <= to; i++) h += '<option value="' + i + '">' + i + '</option>';
    sel.innerHTML = h;
  }

  $('btnCode').onclick = function () {
    $('joinErr').textContent = '';
    var code = $('code').value.trim();
    api('studentRoomInfo', [code], { get: true, retry: 2 }).then(function (info) {
      opts($('ban'), 1, Math.max(10, info.ban), '반 고르기');
      opts($('num'), 1, info.size, '번호 고르기');
      opts($('grp'), 1, info.groups, '모둠 고르기');
      $('joinMore').classList.remove('hide');
    }).catch(function (e) { $('joinErr').textContent = errMsg(e); });
  };
  $('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btnCode').click(); });

  $('btnJoin').onclick = function () {
    var code = $('code').value.trim(), ban = $('ban').value, num = $('num').value, grp = $('grp').value;
    if (!ban || !num || !grp) { $('joinErr').textContent = '반·번호·모둠을 모두 골라 주세요.'; return; }
    $('btnJoin').disabled = true;
    api('studentJoin', [code, ban, num, grp, sid], { retry: 2 }).then(function (r) {
      me = { code: code, ban: r.ban, num: r.num, group: r.group };
      localStorage.setItem('jr_me', JSON.stringify(me));
      enterLive();
    }).catch(function (e) { $('joinErr').textContent = errMsg(e); })
      .then(function () { $('btnJoin').disabled = false; });
  };

  function enterLive() {
    $('vJoin').classList.add('hide');
    $('vLive').classList.remove('hide');
    $('whoTxt').textContent = me.ban + '반 ' + me.num + '번 · ' + me.group + '모둠';
    renderedKey = '';
    poller.start();
  }

  function leave(msg) {
    poller.stop();
    me = null; localStorage.removeItem('jr_me');
    $('vLive').classList.add('hide');
    $('vJoin').classList.remove('hide');
    $('joinMore').classList.add('hide');
    $('joinErr').textContent = msg || '';
  }

  // 5~6초마다 새 상태 받기. 느리거나 끊기면 "다시 연결 중" 띠 + 자동 재시도(common.js)
  var poller = makePoller(function () {
    return api('studentPoll', [me.code, me.num, sid], { get: true, timeout: 15000 });
  }, function (st) {
    if (!me) return;
    $('liveErr').textContent = '';
    if (st.gone) { leave(st.msg); return; }
    syncClock(st.now);
    last = st;
    render(st);
  }, function (e) {
    $('liveErr').textContent = errMsg(e); // 서버가 거절한 경우: 메시지를 보이고 계속 다시 시도
    return false;
  }, 5000, 1000);

  function render(st) {
    var key = st.phase + '|' + st.qi + '|' + st.ver;
    var baseKey = st.phase + '|' + st.qi;
    if (baseKey !== renderedKey.split('|').slice(0, 2).join('|')) { pick = { a: null, c: null }; draw(st); }
    else if (st.phase === 'lobby' || st.phase === 'discuss' || st.phase === 'reveal' || st.phase === 'end') { if (key !== renderedKey) draw(st); }
    renderedKey = key;
    updateStatus(st);
  }

  function qHead(st) {
    var q = st.q;
    return '<div class="card"><div class="muted">' + (st.qi + 1) + ' / ' + st.total + ' · ' + esc(q.topic) + '</div>' +
      '<p style="font-weight:600">' + esc(q.text) + '</p>' + (q.img ? '<img class="qimg" src="' + esc(q.img) + '" alt="문항 그림">' : '') + '</div>';
  }

  function draw(st) {
    var h = '';
    var my = st.my || {};
    if (st.phase === 'lobby') {
      h = '<div class="card big">선생님이 문제를 열 때까지 기다려요 🙂</div>';
    } else if (st.phase === 'r1' || st.phase === 'r2') {
      var rd = st.phase === 'r1' ? 1 : 2;
      var mine = my[rd];
      if (mine) pick = { a: mine.a, c: mine.c };
      h = qHead(st) + '<div id="optBox">';
      st.q.opts.forEach(function (o, i) {
        var n = i + 1;
        var prev = rd === 2 && my[1] && my[1].a === n;
        h += '<button class="opt' + (pick.a === n ? ' sel' : '') + (prev ? ' prev' : '') + '" data-a="' + n + '">' + CIRCLED[i] + ' ' + esc(o) +
          (prev ? '<span class="tag">1차 내 답</span>' : '') + '</button>';
      });
      h += '</div><div class="card"><div style="font-weight:600;margin-bottom:6px">얼마나 확신해요?</div><div class="row conf" id="confBox">' +
        ['확실', '반반', '찍음'].map(function (c) { return '<button data-c="' + c + '" class="' + (pick.c === c ? 'sel' : '') + '">' + c + '</button>'; }).join('') +
        '</div><input id="why" class="why" maxlength="60" placeholder="' + (rd === 1 ? '왜 그렇게 골랐는지 한 줄로 (이름은 쓰지 마세요)' : '바꿨다면 왜? (안 써도 돼요, 이름은 쓰지 마세요)') + '">' +
        '<div class="muted" style="font-size:13px;text-align:right"><span id="whyLen">0</span>/60</div>' +
        '<button id="btnSubmit" class="primary full" style="margin-top:8px">제출</button><div id="subStatus" class="status"></div></div>';
    } else if (st.phase === 'discuss') {
      var a = my[1];
      h = qHead(st) + '<div class="card big">짝·모둠과 이야기해요 💬</div>' +
        '<div class="card">내가 고른 답: <b>' + (a ? CIRCLED[a.a - 1] + ' ' + esc(st.q.opts[a.a - 1]) : '(1차에 안 냈어요)') + '</b></div>';
    } else if (st.phase === 'reveal') {
      h = qHead(st);
      st.q.opts.forEach(function (o, i) {
        var n = i + 1, tags = [];
        if (my[1] && my[1].a === n) tags.push('1차');
        if (my[2] && my[2].a === n) tags.push('2차');
        h += '<div class="opt' + (n === st.ans ? ' correct' : '') + '" style="border:2px solid var(--line);border-radius:10px">' + CIRCLED[i] + ' ' + esc(o) +
          (n === st.ans ? ' <b class="ok">정답</b>' : '') + (tags.length ? '<span class="tag">내 답: ' + tags.join('·') + '</span>' : '') + '</div>';
      });
      var mark = function (e) { return e ? (e.a === st.ans ? '<span class="ok">○</span>' : '<span class="no">×</span>') : '<span class="muted">-</span>'; };
      h += '<div class="card">1차 ' + mark(my[1]) + ' &nbsp; 2차 ' + mark(my[2]) + '</div>' +
        (st.explain ? '<div class="card"><b>해설</b><p>' + esc(st.explain) + '</p></div>' : '');
    } else if (st.phase === 'end') {
      h = '<div class="card"><b>오늘 내 결과</b><table class="res"><tr><th>문항</th><th>1차</th><th>2차</th></tr>' +
        st.results.map(function (r) {
          var m = function (v) { return v === 'O' ? '<span class="ok">○</span>' : v === 'X' ? '<span class="no">×</span>' : '-'; };
          return '<tr><td style="text-align:left">' + esc(r.topic) + '</td><td>' + m(r.r1) + '</td><td>' + m(r.r2) + '</td></tr>';
        }).join('') + '</table><p class="muted">수고했어요! 이제 창을 닫아도 돼요.</p></div>';
    }
    $('screen').innerHTML = h;
    bindForm(st);
  }

  function bindForm(st) {
    var box = $('optBox');
    if (!box) return;
    var rd = st.phase === 'r1' ? 1 : 2;
    var mine = (st.my || {})[rd];
    if (mine && mine.why) $('why').value = mine.why;
    $('whyLen').textContent = $('why').value.length;
    $('why').oninput = function () { $('whyLen').textContent = this.value.length; };
    box.querySelectorAll('.opt').forEach(function (b) {
      b.onclick = function () {
        pick.a = Number(b.dataset.a);
        box.querySelectorAll('.opt').forEach(function (x) { x.classList.toggle('sel', x === b); });
      };
    });
    $('confBox').querySelectorAll('button').forEach(function (b) {
      b.onclick = function () {
        pick.c = b.dataset.c;
        $('confBox').querySelectorAll('button').forEach(function (x) { x.classList.toggle('sel', x === b); });
      };
    });
    $('btnSubmit').onclick = function () {
      var why = $('why').value.trim();
      if (!pick.a) { $('subStatus').innerHTML = '<span class="no">보기를 골라 주세요.</span>'; return; }
      if (!pick.c) { $('subStatus').innerHTML = '<span class="no">확신도를 골라 주세요.</span>'; return; }
      if (rd === 1 && !why) { $('subStatus').innerHTML = '<span class="no">한 줄 이유를 써 주세요.</span>'; return; }
      $('btnSubmit').disabled = true;
      $('subStatus').textContent = '보내는 중…';
      // 같은 답을 두 번 받아도 같은 칸을 고쳐 쓰므로 연결 문제면 자동으로 두 번 더 보냄
      api('studentSubmit', [me.code, me.num, sid, rd, pick.a, pick.c, why], { retry: 2 }).then(function (r) {
        $('subStatus').textContent = '냈어요 ✔ (시간 안에는 고쳐 낼 수 있어요)';
        if (last && last.my) last.my[rd] = { a: pick.a, c: pick.c, why: why, cnt: r.cnt };
      }).catch(function (e) { $('subStatus').innerHTML = '<span class="no">' + esc(errMsg(e)) + '</span>'; })
        .then(function () { $('btnSubmit').disabled = false; tick(); });
    };
  }

  function updateStatus(st) {
    var rd = st.phase === 'r1' ? 1 : st.phase === 'r2' ? 2 : 0;
    if (rd && st.my && st.my[rd] && $('subStatus') && !$('subStatus').textContent) $('subStatus').textContent = '냈어요 ✔ (시간 안에는 고쳐 낼 수 있어요)';
  }

  function tick() {
    if (!last || !me) { $('timer').textContent = ''; return; }
    var s = leftSec(last.start, last.dur);
    $('timer').textContent = s == null ? '-' : fmtSec(s);
    $('timer').classList.toggle('low', s != null && s <= 10);
    var btn = $('btnSubmit');
    if (btn && s === 0) { btn.disabled = true; btn.textContent = '시간이 끝났어요'; btn.dataset.ended = '1'; }
    else if (btn && s > 0 && btn.dataset.ended) { btn.disabled = false; btn.textContent = '제출'; delete btn.dataset.ended; }
  }
  setInterval(tick, 250);

  // 새로 고침해도 이어서
  try {
    var saved = JSON.parse(localStorage.getItem('jr_me') || 'null');
    if (saved && saved.code) { me = saved; $('code').value = saved.code; enterLive(); }
  } catch (e) {}
</script>
</body>
</html>
